<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>予約</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 40px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
    }

    h1 {
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      background: #1976d2;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #1258a7;
    }

    .back-btn {
      background: #666;
    }

    .back-btn:hover {
      background: #444;
    }

    .error {
      color: red;
      margin-top: 6px;
      font-size: 14px;
    }

    .success {
      color: green;
      margin-bottom: 20px;
      font-size: 16px;
      font-weight: bold;
    }

    .confirm-box {
      background: #fafafa;
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .confirm-item {
      margin-bottom: 15px;
    }

    .confirm-label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>予約</h1>

  <!-- 输入页 -->
  <div id="formPage">

    <!-- 成功提示 -->
    <div class="success" id="success"></div>

    <form id="bookingForm">

      <div class="form-group">
        <label>名前</label>
        <input type="text" id="name" required />
      </div>

      <div class="form-group">
        <label>電子メール</label>
        <input type="email" id="email" />
      </div>

      <div class="form-group">
        <label>電話番号(ハイフンなしで入力してください)</label>
        <input type="text" id="phone" required />
      </div>

      <div class="form-group">
        <label>予約年月日</label>
        <input type="date" id="date" required />
      </div>

      <div class="form-group">
        <label>予約時間</label>

        <select id="time" required>

          <option value="">選択してください</option>

          <option value="10:00">10:00</option>
          <option value="11:00">11:00</option>
          <option value="12:00">12:00</option>
          <option value="13:00">13:00</option>
          <option value="14:00">14:00</option>
          <option value="15:00">15:00</option>
          <option value="16:00">16:00</option>
          <option value="17:00">17:00</option>
          <option value="18:00">18:00</option>
          <option value="19:00">19:00</option>

        </select>
      </div>

      <div class="form-group">

        <label>サービス</label>

        <select id="service" required>

          <option value="">選択してください</option>

          <option>かっさ 20分/1800円</option>
          <option>吸い玉(伝統火罐十スライドカッピング) 20分/3000円</option>
          <option>手技による伝統懸灸(肩·首·腰·背中) 60分/7000円</option>
          <option>手技による伝統懸灸(肩·首·腰·背中) 十 吸い玉 75分/9000円</option>
          <option>手技による伝統懸灸(肩·首·腰·背中) 十 かっさ 70分/8000円</option>
          <option>手技による伝統懸灸(胸部) 60分/7000円</option>
          <option>手技による伝統懸灸(腹部) 60分/7000円</option>
          <option>手技による伝統懸灸(頭部·顔) 60分/6000円</option>
          <option>小児向け伝統施術(推拿·脊柱ケ·腹部ケア) 60分/6000円</option>
          <option>手技による伝統懸灸(脚) 70分/8000円</option>
          <option>手技による伝統懸灸(背中+腹部) 120分/13000円</option>

        </select>

      </div>

      <button type="submit">
        確認ページへ
      </button>

      <div class="error" id="error"></div>

    </form>

  </div>

  <!-- 确认页 -->
  <div id="confirmPage" class="hidden">

    <div class="confirm-box">

      <div class="confirm-item">
        <div class="confirm-label">名前</div>
        <div id="confirmName"></div>
      </div>

      <div class="confirm-item">
        <div class="confirm-label">電子メール</div>
        <div id="confirmEmail"></div>
      </div>

      <div class="confirm-item">
        <div class="confirm-label">電話番号</div>
        <div id="confirmPhone"></div>
      </div>

      <div class="confirm-item">
        <div class="confirm-label">予約年月日</div>
        <div id="confirmDate"></div>
      </div>

      <div class="confirm-item">
        <div class="confirm-label">予約時間</div>
        <div id="confirmTime"></div>
      </div>

      <div class="confirm-item">
        <div class="confirm-label">サービス</div>
        <div id="confirmService"></div>
      </div>

    </div>

    <button id="sendBtn">
      確認して送信
    </button>

    <button id="backBtn" class="back-btn">
      修正する
    </button>

    <div class="error" id="confirmError"></div>

  </div>

</div>

<script>

  const FORMSPREE_URL = "https://formspree.io/f/mqenwlgz";

  const form = document.getElementById("bookingForm");

  const formPage = document.getElementById("formPage");
  const confirmPage = document.getElementById("confirmPage");

  const errorBox = document.getElementById("error");
  const confirmError = document.getElementById("confirmError");
  const successBox = document.getElementById("success");

  let bookingData = null;

  // 日期最小值
  const dateInput = document.getElementById("date");

  const today = new Date();

  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");

  dateInput.min = `${year}-${month}-${day}`;

  // 获取预约
  function getBookings() {

    return JSON.parse(localStorage.getItem("bookings") || "[]");
  }

  // 保存预约
  function saveBooking(booking) {

    const bookings = getBookings();

    bookings.push(booking);

    localStorage.setItem("bookings", JSON.stringify(bookings));
  }

  // 时间冲突检查
  function isTimeConflict(date, time) {

    const bookings = getBookings();

    return bookings.some(item => {

      return item.日期 === date && item.时间 === time;
    });
  }

  // 第一步：进入确认页
  form.addEventListener("submit", function (e) {

    e.preventDefault();

    errorBox.textContent = "";
    successBox.textContent = "";

    const phone = document.getElementById("phone").value.trim();

    const phoneRegex = /^[0-9]{10,11}$/;

    if (!phoneRegex.test(phone)) {

      errorBox.textContent = "正しい電話番号を入力してください";

      return;
    }

    bookingData = {

      姓名: document.getElementById("name").value,
      电子邮件: document.getElementById("email").value,
      电话: phone,
      日期: document.getElementById("date").value,
      时间: document.getElementById("time").value,
      服务: document.getElementById("service").value,
    };

    // 时间冲突
    if (isTimeConflict(bookingData.日期, bookingData.时间)) {

      errorBox.textContent = "この時間は既に予約されています。";

      return;
    }

    // 显示确认内容
    document.getElementById("confirmName").textContent = bookingData.姓名;
    document.getElementById("confirmEmail").textContent = bookingData.电子邮件;
    document.getElementById("confirmPhone").textContent = bookingData.电话;
    document.getElementById("confirmDate").textContent = bookingData.日期;
    document.getElementById("confirmTime").textContent = bookingData.时间;
    document.getElementById("confirmService").textContent = bookingData.服务;

    // 页面切换
    formPage.classList.add("hidden");
    confirmPage.classList.remove("hidden");

    window.scrollTo(0, 0);

  });

  // 返回修改
  document.getElementById("backBtn").addEventListener("click", function () {

    confirmPage.classList.add("hidden");
    formPage.classList.remove("hidden");

    window.scrollTo(0, 0);

  });

  // 最终发送
  document.getElementById("sendBtn").addEventListener("click", async function () {

    confirmError.textContent = "";
    successBox.textContent = "";

    try {

      const response = await fetch(FORMSPREE_URL, {

        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },

        body: JSON.stringify(bookingData)

      });

      if (response.ok) {

        // 保存预约
        saveBooking(bookingData);

        // 返回输入页
        confirmPage.classList.add("hidden");
        formPage.classList.remove("hidden");

        // 成功提示
        successBox.textContent = "予約が完了しました。";

        // 清空表单
        form.reset();

        // 回顶部
        window.scrollTo(0, 0);

      } else {

        confirmError.textContent = "送信失敗";

      }

    } catch (err) {

      confirmError.textContent = "システムエラー";

    }

  });

</script>

</body>
</html>
