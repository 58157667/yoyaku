<!DOCTYPE html>
<html lang="zh">
<head>

    <meta charset="UTF-8">

    <title>予約</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>211AMOY予約</h1>

    名前<input
            type="text"
            id="name"
            placeholder="必須"
    >
電子メール
    <input
            type="email"
            id="email"
            placeholder="必須"
    >
電話番号
    <input
            type="text"
            id="phone"
            placeholder="必須"
    >
予約年月日
    <input
            type="date"
            id="date"
    >
予約時間
    <select id="time">
<option>必須</option>
<option>09:00</option>
        <option>10:00</option>
        <option>11:00</option>
        <option>12:00</option>
        <option>13:00</option>
 <option>14:00</option>
        <option>15:00</option>
        <option>16:00</option>
        <option>17:00</option>
          <option>18:00</option>
        <option>19:00</option>
     
    </select>
サービス
    <select id="service">
		<option>必須</option>
		        <option>かっさ 20分/1800円</option>
        <option>吸い玉(伝統火罐十スライドカッピング) 20分/3000円</option>
  
 <option>手技による伝統懸灸(肩·首·腰·背中) 60分/7000円</option>
        <option>手技による伝統懸灸(肩·首·腰·背中) 十 吸い玉 75分/9000円</option>
        <option>手技による伝統懸灸(肩·首·腰·背中) 十 かっさ 70分/8000円</option>
        <option>手技による伝統懸灸(胸部) 60分7000円</option>
         <option>手技による伝統懸灸(腹部) 60分7000円</option>
          <option>手技による伝統懸灸(頭部·顔) 60分6000円</option>
           <option>小児向け伝統施術(推拿·脊柱ケ·腹部ケア) 60分6000円</option>
            <option>手技による伝統懸灸(脚) 70分?8000円</option>
             <option>手技による伝統懸灸(背中+腹部) 120分13000円</option>


    </select>

    <button onclick="submitReservation()">
        提出
    </button>

</div>

<script src="app.js"></script>

</body>
</html>
